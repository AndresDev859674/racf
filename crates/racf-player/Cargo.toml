[package]
name = "racf-player"
description = "CLI audio player for RACF files"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"

[dependencies]
cpal.workspace = true
crossterm = "0.28"
racf-core = { path = "../racf-core" }
racf-engine = { path = "../racf-engine" }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.11", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time"] }

[[bin]]
name = "racf-player"
path = "src/main.rs"
