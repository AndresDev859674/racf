[package]
name = "racf-player"
description = "Audio player and DSP engine for RACF files"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cpal.workspace = true
racf-core = { path = "../racf-core" }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.11", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time"] }

[[bin]]
name = "racf-player"
path = "src/main.rs"
