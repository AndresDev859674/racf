[workspace]
resolver = "2"
members = [
    "crates/racf-core",
    "crates/racf-engine",
    "crates/racf-player",
    "crates/racf-ffi",
    "crates/racf-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
roxmltree = "0.19"
symphonia = { version = "0.5.4", default-features = false, features = ["flac", "mp3", "pcm", "wav"] }
tempfile = "3"
